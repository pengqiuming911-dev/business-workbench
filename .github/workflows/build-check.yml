name: Build Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend-go/go.sum
      - name: Build backend
        run: |
          cd backend-go
          go build ./...
      - name: Vet backend
        run: |
          cd backend-go
          go vet ./...
