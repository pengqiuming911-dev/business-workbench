name: Deploy to Aliyun Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_DIR: /var/www/business-workbench
  GO_VERSION: '1.22'
  NODE_VERSION: '20'
  SERVICE_NAME: business-workbench
  PORT: '3001'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: |
          package-lock.json
          frontend/package-lock.json

    - name: Install dependencies
      run: |
        npm ci
        npm --prefix frontend ci

    - name: Build frontend
      run: npm --prefix frontend run build

    - name: Build Go backend (linux/amd64)
      run: |
        mkdir -p dist/release/backend-go dist/release/frontend
        cd backend-go
        GOOS=linux GOARCH=amd64 go build -o ../dist/release/server ./cmd/server

    - name: Prepare release bundle
      run: |
        cp -R frontend/dist dist/release/frontend/
        if [ -d backend-go/public ]; then
          cp -R backend-go/public dist/release/backend-go/
        fi
        cp scripts/deploy/remote-deploy.sh dist/remote-deploy.sh
        chmod +x dist/remote-deploy.sh
        tar -czf dist/release.tar.gz -C dist/release .

    - name: Upload release bundle and deploy script
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "dist/release.tar.gz,dist/remote-deploy.sh"
        target: "/tmp/"
        strip_components: 1

    - name: Ensure server directories and shared env
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          mkdir -p ${{ env.APP_DIR }}/shared
          mkdir -p ${{ env.APP_DIR }}/releases
          CURRENT_FEISHU_REDIRECT_URI=""
          CURRENT_FRONTEND_URL=""
          if [ -f ${{ env.APP_DIR }}/shared/.env ]; then
            CURRENT_FEISHU_REDIRECT_URI="$(grep '^FEISHU_REDIRECT_URI=' ${{ env.APP_DIR }}/shared/.env | tail -n 1 | cut -d= -f2- || true)"
            CURRENT_FRONTEND_URL="$(grep '^FRONTEND_URL=' ${{ env.APP_DIR }}/shared/.env | tail -n 1 | cut -d= -f2- || true)"
          fi
          if [ -z "$CURRENT_FEISHU_REDIRECT_URI" ]; then
            CURRENT_FEISHU_REDIRECT_URI='${{ secrets.FEISHU_REDIRECT_URI }}'
          fi
          if [ -z "$CURRENT_FRONTEND_URL" ]; then
            CURRENT_FRONTEND_URL='${{ secrets.FRONTEND_URL }}'
          fi
          CURRENT_INTERNAL_DOCX_TOKEN=""
          if [ -f ${{ env.APP_DIR }}/shared/.env ]; then
            CURRENT_INTERNAL_DOCX_TOKEN="$(grep '^INTERNAL_DOCX_TOKEN=' ${{ env.APP_DIR }}/shared/.env | tail -n 1 | cut -d= -f2- || true)"
          fi
          if [ -z "$CURRENT_INTERNAL_DOCX_TOKEN" ]; then
            CURRENT_INTERNAL_DOCX_TOKEN='${{ secrets.INTERNAL_DOCX_TOKEN }}'
          fi
          CURRENT_INTERNAL_DOCX_ALLOW_IPS=""
          if [ -f ${{ env.APP_DIR }}/shared/.env ]; then
            CURRENT_INTERNAL_DOCX_ALLOW_IPS="$(grep '^INTERNAL_DOCX_ALLOW_IPS=' ${{ env.APP_DIR }}/shared/.env | tail -n 1 | cut -d= -f2- || true)"
          fi
          CURRENT_SMTP_HOST=""
          CURRENT_SMTP_PORT=""
          CURRENT_SMTP_SECURE=""
          CURRENT_SMTP_USER=""
          CURRENT_SMTP_PASS=""
          CURRENT_SMTP_FROM=""
          if [ -f ${{ env.APP_DIR }}/shared/.env ]; then
            CURRENT_SMTP_HOST="$(grep '^SMTP_HOST=' ${{ env.APP_DIR }}/shared/.env | tail -n 1 | cut -d= -f2- || true)"
            CURRENT_SMTP_PORT="$(grep '^SMTP_PORT=' ${{ env.APP_DIR }}/shared/.env | tail -n 1 | cut -d= -f2- || true)"
            CURRENT_SMTP_SECURE="$(grep '^SMTP_SECURE=' ${{ env.APP_DIR }}/shared/.env | tail -n 1 | cut -d= -f2- || true)"
            CURRENT_SMTP_USER="$(grep '^SMTP_USER=' ${{ env.APP_DIR }}/shared/.env | tail -n 1 | cut -d= -f2- || true)"
            CURRENT_SMTP_PASS="$(grep '^SMTP_PASS=' ${{ env.APP_DIR }}/shared/.env | tail -n 1 | cut -d= -f2- || true)"
            CURRENT_SMTP_FROM="$(grep '^SMTP_FROM=' ${{ env.APP_DIR }}/shared/.env | tail -n 1 | cut -d= -f2- || true)"
          fi
          if [ -z "$CURRENT_SMTP_HOST" ]; then CURRENT_SMTP_HOST='${{ secrets.SMTP_HOST }}'; fi
          if [ -z "$CURRENT_SMTP_PORT" ]; then CURRENT_SMTP_PORT='${{ secrets.SMTP_PORT }}'; fi
          if [ -z "$CURRENT_SMTP_SECURE" ]; then CURRENT_SMTP_SECURE='${{ secrets.SMTP_SECURE }}'; fi
          if [ -z "$CURRENT_SMTP_USER" ]; then CURRENT_SMTP_USER='${{ secrets.SMTP_USER }}'; fi
          if [ -z "$CURRENT_SMTP_PASS" ]; then CURRENT_SMTP_PASS='${{ secrets.SMTP_PASS }}'; fi
          if [ -z "$CURRENT_SMTP_FROM" ]; then CURRENT_SMTP_FROM='${{ secrets.SMTP_FROM }}'; fi
          cat > ${{ env.APP_DIR }}/shared/.env << 'EOF'
          FEISHU_APP_ID=${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET=${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_REDIRECT_URI=__FEISHU_REDIRECT_URI__
          FRONTEND_URL=__FRONTEND_URL__
          PORT=${{ env.PORT }}
          DATABASE_PATH=data.sqlite
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_URL=${{ secrets.DEEPSEEK_API_URL }}
          DEEPSEEK_MODEL=${{ secrets.DEEPSEEK_MODEL }}
          TONGYU_USER=${{ secrets.TONGYU_USER }}
          TONGYU_PASS=${{ secrets.TONGYU_PASS }}
          CHROME_PATH=/snap/bin/chromium
          FEISHU_PUSH_WEBHOOK=${{ secrets.FEISHU_PUSH_WEBHOOK }}
          SMTP_HOST=__SMTP_HOST__
          SMTP_PORT=__SMTP_PORT__
          SMTP_SECURE=__SMTP_SECURE__
          SMTP_USER=__SMTP_USER__
          SMTP_PASS=__SMTP_PASS__
          SMTP_FROM=__SMTP_FROM__
          CRON_TIMEZONE=Asia/Shanghai
          INTERNAL_DOCX_TOKEN=__INTERNAL_DOCX_TOKEN__
          INTERNAL_DOCX_ALLOW_IPS=__INTERNAL_DOCX_ALLOW_IPS__
          EOF
          sed -i "s|__FEISHU_REDIRECT_URI__|$CURRENT_FEISHU_REDIRECT_URI|g" ${{ env.APP_DIR }}/shared/.env
          sed -i "s|__FRONTEND_URL__|$CURRENT_FRONTEND_URL|g" ${{ env.APP_DIR }}/shared/.env
          sed -i "s|__SMTP_HOST__|$CURRENT_SMTP_HOST|g" ${{ env.APP_DIR }}/shared/.env
          sed -i "s|__SMTP_PORT__|$CURRENT_SMTP_PORT|g" ${{ env.APP_DIR }}/shared/.env
          sed -i "s|__SMTP_SECURE__|$CURRENT_SMTP_SECURE|g" ${{ env.APP_DIR }}/shared/.env
          sed -i "s|__SMTP_USER__|$CURRENT_SMTP_USER|g" ${{ env.APP_DIR }}/shared/.env
          sed -i "s|__SMTP_PASS__|$CURRENT_SMTP_PASS|g" ${{ env.APP_DIR }}/shared/.env
          sed -i "s|__SMTP_FROM__|$CURRENT_SMTP_FROM|g" ${{ env.APP_DIR }}/shared/.env
          sed -i "s|__INTERNAL_DOCX_TOKEN__|$CURRENT_INTERNAL_DOCX_TOKEN|g" ${{ env.APP_DIR }}/shared/.env
          sed -i "s|__INTERNAL_DOCX_ALLOW_IPS__|$CURRENT_INTERNAL_DOCX_ALLOW_IPS|g" ${{ env.APP_DIR }}/shared/.env
          chmod 600 ${{ env.APP_DIR }}/shared/.env
          if [ ! -f ${{ env.APP_DIR }}/shared/data.sqlite ] && [ -f ${{ env.APP_DIR }}/backend-go/data.sqlite ]; then
            cp ${{ env.APP_DIR }}/backend-go/data.sqlite ${{ env.APP_DIR }}/shared/data.sqlite
          fi

    - name: Run remote deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          chmod +x /tmp/remote-deploy.sh
          APP_DIR=${{ env.APP_DIR }} \
          SERVICE_NAME=${{ env.SERVICE_NAME }} \
          PORT=${{ env.PORT }} \
          RELEASE_NAME=main-${{ github.run_number }}-${{ github.sha }} \
          RELEASE_TARBALL=/tmp/release.tar.gz \
          bash /tmp/remote-deploy.sh

    - name: Verify public health endpoint
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          curl -fsS http://127.0.0.1:${{ env.PORT }}/api/health
          sudo nginx -t
